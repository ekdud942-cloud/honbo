<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 프론트엔드 개발자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 오라 -->
  <div class="aura" aria-hidden="true"></div>

  <!-- 자기소개 카드 -->
  <main class="card">
    <div class="avatar">
      <div class="avatar-inner" aria-hidden="true">👨‍💻</div>
    </div>

    <h1 class="name">홍길동</h1>
    <p class="job">Frontend Developer</p>
    <p class="job-ko">프론트엔드 개발자</p>

    <div class="divider" aria-hidden="true"></div>

    <!-- 취미 -->
    <section class="hobbies">
      <h2>Hobbies</h2>
      <ul>
        <li><span aria-hidden="true">🎬</span> 영화 감상</li>
        <li><span aria-hidden="true">💻</span> 코딩</li>
        <li><span aria-hidden="true">✈️</span> 여행</li>
      </ul>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>

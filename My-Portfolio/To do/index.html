<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 할 일 목록</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 할 일 목록 카드 -->
    <main class="todo">
      <h1 class="todo__title">📝 나의 할 일 목록</h1>

      <!-- 입력 영역 -->
      <form class="todo__form" id="todo-form">
        <input
          class="todo__input"
          id="todo-input"
          type="text"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <button class="todo__add" id="add-btn" type="submit">추가</button>
      </form>

      <!-- 할 일 개수 표시 -->
      <p class="todo__count">
        <span id="count-total">전체 0개</span>
        <span class="todo__count-done" id="count-done">완료 0개</span>
      </p>

      <!-- 필터 버튼 (전체 / 진행중 / 완료) -->
      <div class="todo__filters" id="todo-filters" role="group" aria-label="할 일 필터">
        <button
          class="todo__filter is-selected"
          type="button"
          data-filter="all"
          aria-pressed="true"
        >
          전체
        </button>
        <button
          class="todo__filter"
          type="button"
          data-filter="active"
          aria-pressed="false"
        >
          진행중
        </button>
        <button
          class="todo__filter"
          type="button"
          data-filter="done"
          aria-pressed="false"
        >
          완료
        </button>
      </div>

      <!-- 할 일 목록 영역 -->
      <ul class="todo__list" id="todo-list"></ul>

      <!-- 목록이 비었을 때 보여줄 안내 문구 (문구는 필터에 따라 바뀜) -->
      <p class="todo__empty" id="todo-empty">
        할 일이 없습니다. 위에 입력해 보세요!
      </p>

      <!-- 완료 항목 일괄 삭제 -->
      <button class="todo__clear" id="clear-done" type="button" disabled>
        완료된 항목 삭제
      </button>
    </main>

    <script src="main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter">
    <h1 class="counter__title">카운터</h1>

    <!-- 현재 카운트 값이 표시되는 영역 -->
    <div class="counter__display" id="display" aria-live="polite">0</div>

    <div class="counter__buttons">
      <!-- 감소 버튼 -->
      <button class="btn btn--minus" id="decrease" type="button" aria-label="1 감소">−</button>
      <!-- 리셋 버튼 -->
      <button class="btn btn--reset" id="reset" type="button">리셋</button>
      <!-- 증가 버튼 -->
      <button class="btn btn--plus" id="increase" type="button" aria-label="1 증가">+</button>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스네이크 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>스네이크 게임</h1>
    <div class="scores">
      <div>점수: <span id="score">0</span></div>
      <div>레벨: <span id="level">1</span></div>
      <div>최고 점수: <span id="highScore">0</span></div>
    </div>
    <div class="controls">
      <label>난이도
        <select id="difficulty">
          <option value="200">쉬움 (200ms)</option>
          <option value="150" selected>보통 (150ms)</option>
          <option value="100">어려움 (100ms)</option>
          <option value="50">매우 어려움 (50ms)</option>
        </select>
      </label>
      <button id="pauseBtn" disabled>일시정지</button>
      <button id="muteBtn" title="소리 켜기/끄기">🔊</button>
    </div>
    <div class="board">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <p id="message">방향키로 뱀을 조종하세요</p>
        <button id="startBtn">게임 시작</button>
        <button id="restartBtn" class="hidden">다시 시작</button>
      </div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>

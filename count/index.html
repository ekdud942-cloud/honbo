<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter">
    <!-- 현재 숫자 표시 영역 -->
    <div id="count" class="count">0</div>

    <!-- 증가 / 감소 / 리셋 버튼 -->
    <div class="buttons">
      <button id="decrease" aria-label="감소">-</button>
      <button id="reset">리셋</button>
      <button id="increase" aria-label="증가">+</button>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>

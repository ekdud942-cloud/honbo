<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환율 변환기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="converter">
    <h1 class="converter__title">환율 변환기</h1>

    <!-- 금액 입력 -->
    <div class="converter__field">
      <label class="converter__label" for="amount">금액</label>
      <input
        class="converter__input"
        id="amount"
        type="number"
        min="0"
        step="any"
        inputmode="decimal"
        placeholder="금액을 입력하세요"
      >
    </div>

    <!-- 변환할 통화 선택 -->
    <div class="converter__field">
      <label class="converter__label" for="from">From</label>
      <select class="converter__select" id="from">
        <option value="USD">USD - 미국 달러</option>
        <option value="EUR">EUR - 유로</option>
        <option value="KRW">KRW - 대한민국 원</option>
        <option value="JPY">JPY - 일본 엔</option>
      </select>
    </div>

    <!-- 통화 교환 버튼 -->
    <button
      class="converter__swap"
      id="swap-btn"
      type="button"
      aria-label="From과 To 통화 교환"
    >⇅ 통화 교환</button>

    <div class="converter__field">
      <label class="converter__label" for="to">To</label>
      <select class="converter__select" id="to">
        <option value="USD">USD - 미국 달러</option>
        <option value="EUR">EUR - 유로</option>
        <option value="KRW" selected>KRW - 대한민국 원</option>
        <option value="JPY">JPY - 일본 엔</option>
      </select>
    </div>

    <!-- 변환 버튼 -->
    <button class="converter__button" id="convert" type="button">변환하기</button>

    <!-- 결과 표시 영역 -->
    <div class="converter__result" id="result" aria-live="polite"></div>
  </main>

  <script src="main.js" defer></script>
</body>
</html>

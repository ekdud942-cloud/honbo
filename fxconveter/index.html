<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환율 변환기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 class="title">환율 변환기</h1>

    <label class="field">
      <span>금액</span>
      <input type="number" id="amount" min="0" step="any" inputmode="decimal" placeholder="금액을 입력하세요">
    </label>

    <div class="row">
      <label class="field">
        <span>From</span>
        <select id="from-currency">
          <option value="USD" selected>USD</option>
          <option value="EUR">EUR</option>
          <option value="KRW">KRW</option>
          <option value="JPY">JPY</option>
        </select>
      </label>

      <button type="button" id="swap-btn" class="swap-btn" aria-label="From과 To 통화 교환" title="통화 교환">⇄</button>

      <label class="field">
        <span>To</span>
        <select id="to-currency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="KRW" selected>KRW</option>
          <option value="JPY">JPY</option>
        </select>
      </label>
    </div>

    <button type="button" id="convert-btn" class="convert-btn">통화 변환</button>

    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>

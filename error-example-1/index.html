<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱 - 에러 예제 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <h1>카운터 (에러 예제 1: ID 오타)</h1>
        <p class="error-hint">⚠️ 이 예제는 의도적으로 에러가 포함되어 있습니다. F12를 눌러 콘솔을 확인하세요!</p>
        <div id="count">0</div>
        <div class="buttons">
            <button id="decreaseBtn">-</button>
            <button id="resetBtn">리셋</button>
            <button id="increaseBtn">+</button>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>

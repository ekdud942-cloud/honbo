<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱 - 에러 예제 2 (해결됨)</title>
    <link rel="stylesheet" href="style.css">
    <!-- head에서 불러오지만 main.js가 DOMContentLoaded를 기다리므로 안전하다.
         (defer 속성을 붙여도 같은 효과) -->
    <script src="main.js" defer></script>
</head>
<body>
    <main id="app">
        <h1>카운터 (에러 예제 2: DOMContentLoaded 누락 → 해결됨)</h1>
        <p class="error-hint">✅ DOMContentLoaded로 감싸서 해결했습니다. 콘솔(F12)에 에러가 없습니다.</p>
        <div id="count">0</div>
        <div class="buttons">
            <button id="decreaseBtn">-</button>
            <button id="resetBtn">리셋</button>
            <button id="increaseBtn">+</button>
        </div>
    </main>
</body>
</html>

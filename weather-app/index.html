<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 앱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- 검색 -->
    <header class="search-bar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="도시 이름을 입력하세요"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="button" id="locate-btn" class="locate-btn" title="현재 위치">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"></circle>
            <circle cx="12" cy="12" r="8"></circle>
            <line x1="12" y1="1" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="23"></line>
            <line x1="1" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="23" y2="12"></line>
          </svg>
        </button>
      </div>
      <ul class="suggestions" id="suggestions" hidden></ul>
    </header>

    <!-- 상태 표시 -->
    <div class="status" id="status" hidden></div>

    <!-- 날씨 본문 -->
    <main class="content" id="content" hidden>

      <!-- 현재 날씨 -->
      <section class="current">
        <p class="place" id="place">—</p>
        <p class="updated" id="updated"></p>

        <div class="current-main">
          <div class="current-icon" id="current-icon">☀️</div>
          <div class="current-temp">
            <span id="current-temp">--</span><span class="deg">°</span>
          </div>
        </div>

        <p class="condition" id="condition">—</p>
        <p class="range">
          <span id="today-max">--°</span>
          <span class="sep">/</span>
          <span id="today-min">--°</span>
          <span class="feels">체감 <span id="feels-like">--°</span></span>
        </p>
      </section>

      <!-- 상세 지표 -->
      <section class="details" id="details">
        <div class="detail-card">
          <span class="detail-label">습도</span>
          <span class="detail-value" id="humidity">--%</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">바람</span>
          <span class="detail-value" id="wind">-- m/s</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">강수확률</span>
          <span class="detail-value" id="precip">--%</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">일출</span>
          <span class="detail-value" id="sunrise">--:--</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">일몰</span>
          <span class="detail-value" id="sunset">--:--</span>
        </div>
        <div class="detail-card">
          <span class="detail-label">자외선</span>
          <span class="detail-value" id="uv">--</span>
        </div>
      </section>

      <!-- 시간별 예보 -->
      <section class="panel">
        <h2 class="panel-title">시간별 예보</h2>
        <div class="hourly-scroll">
          <ul class="hourly" id="hourly"></ul>
        </div>
      </section>

      <!-- 주간 예보 -->
      <section class="panel">
        <h2 class="panel-title">주간 예보</h2>
        <ul class="daily" id="daily"></ul>
      </section>

      <footer class="credit">
        데이터 제공: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
      </footer>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
